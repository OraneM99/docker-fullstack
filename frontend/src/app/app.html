<div class="container">

  <h1>🚗 Car Spotter</h1>

  <div class="form">
    <input
      type="text"
      [(ngModel)]="brand"
      placeholder="Marque"
    />

    <input
      type="text"
      [(ngModel)]="model"
      placeholder="Modèle"
    />

    <button (click)="addCar()">
      Ajouter
    </button>
  </div>

  <h2>Voitures</h2>

  @for (car of cars; track car.id) {
    <div class="car">
      🚘 {{ car.brand }} {{ car.model }}
    </div>
  } @empty {
    <p>Aucune voiture enregistrée.</p>
  }

</div>
