databaseChangeLog:
  - changeSet:
      id: 1
      author: orane
      changes:
        - createTable:
            tableName: car
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: brand
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: model
                  type: VARCHAR(100)
                  constraints:
                    nullable: false