spring.application.name=car-spotter

server.port=8080

spring.r2dbc.url=r2dbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.r2dbc.username=${POSTGRES_USER}
spring.r2dbc.password=${POSTGRES_PASSWORD}

spring.liquibase.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.liquibase.user=${POSTGRES_USER}
spring.liquibase.password=${POSTGRES_PASSWORD}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always